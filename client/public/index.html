<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Colony builder" />
    <meta name="theme-color" content="#343a40" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Colony Builder</title>
    <link rel="preload" href="bundle.js" as="script" />
    <link rel="preload" href="./styles.css" as="style" />
    <link rel="preload" fetchpriority="high" as="image" href="./logo.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
    <link href="./styles.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <canvas></canvas>
      <section id="credit">
        <a href="https://cdrn.cc" target="_blank">
          <img src="./logo.webp" alt="cdrn.cc logo" width="50" height="32" />
        </a>
      </section>
      <section id="parameter-config" aria-label="Parameter configuration menu">
        <div class="overlay-buttons">
          <button id="inventory-btn" class="secondary" title="Inventory">
            <span class="px-icon"></span>
          </button>
          <button id="fullscreen-btn" class="secondary" title="Fullscreen">
            <span class="px-icon"></span>
          </button>
        </div>
        <dialog id="inventory-modal">
          <form>
            <h1>Inventory</h1>
            <input
              class="search"
              type="search"
              placeholder="Search items"
              aria-label="Search items"
              autocomplete="off"
            />
            <ul></ul>
            <div class="dialog-actions">
              <button class="secondary" formmethod="dialog">Close</button>
            </div>
          </form>
        </dialog>
      </section>
    </main>
    <script src="bundle.js"></script>
  </body>
</html>
