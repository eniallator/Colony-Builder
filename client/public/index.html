<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Colony builder" />
    <meta name="theme-color" content="#343a40" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Colony Builder</title>
    <link rel="preload" href="bundle.js" as="script" />
    <link rel="preload" href="./styles.css" as="style" />
    <link rel="preload" fetchpriority="high" as="image" href="./logo.webp" />

    <link href="./styles.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <canvas></canvas>
      <section id="credit">
        <a href="https://cdrn.cc" target="_blank">
          <img src="./logo.webp" alt="cdrn.cc logo" width="50" height="32" />
        </a>
      </section>
      <section id="parameter-config" aria-label="Parameter configuration menu">
        <div class="overlay-buttons">
          <button id="inventory-btn" class="secondary" title="Inventory">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="1em"
              viewBox="0 0 512 512"
            >
              <!--! Font Awesome Free 6.4.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2023 Fonticons, Inc. -->
              <path
                d="M50.7 58.5L0 160H208V32H93.7C75.5 32 58.9 42.3 50.7 58.5zM240 160H448L397.3 58.5C389.1 42.3 372.5 32 354.3 32H240V160zm208 32H0V416c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V192z"
              />
            </svg>
          </button>
          <button id="fullscreen-btn" class="secondary" title="Fullscreen">
            <svg
              class="when-not-fullscreen"
              xmlns="http://www.w3.org/2000/svg"
              height="1em"
              viewBox="0 0 448 512"
            >
              <!--! Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc. -->
              <path
                d="M32 32C14.3 32 0 46.3 0 64l0 96c0 17.7 14.3 32 32 32s32-14.3 32-32l0-64 64 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L32 32zM64 352c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 96c0 17.7 14.3 32 32 32l96 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-64 0 0-64zM320 32c-17.7 0-32 14.3-32 32s14.3 32 32 32l64 0 0 64c0 17.7 14.3 32 32 32s32-14.3 32-32l0-96c0-17.7-14.3-32-32-32l-96 0zM448 352c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 64-64 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l96 0c17.7 0 32-14.3 32-32l0-96z"
              />
            </svg>
            <svg
              class="when-fullscreen"
              xmlns="http://www.w3.org/2000/svg"
              height="1em"
              viewBox="0 0 448 512"
            >
              <!--! Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc. -->
              <path
                d="M160 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 64-64 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l96 0c17.7 0 32-14.3 32-32l0-96zM32 320c-17.7 0-32 14.3-32 32s14.3 32 32 32l64 0 0 64c0 17.7 14.3 32 32 32s32-14.3 32-32l0-96c0-17.7-14.3-32-32-32l-96 0zM352 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 96c0 17.7 14.3 32 32 32l96 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-64 0 0-64zM320 320c-17.7 0-32 14.3-32 32l0 96c0 17.7 14.3 32 32 32s32-14.3 32-32l0-64 64 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0z"
              />
            </svg>
          </button>
        </div>
        <dialog id="inventory-modal">
          <form>
            <h1>Inventory</h1>
            <input
              class="search"
              type="search"
              placeholder="Search items"
              aria-label="Search items"
              autocomplete="off"
            />
            <ul></ul>
            <div class="dialog-actions">
              <button class="secondary" formmethod="dialog">Close</button>
            </div>
          </form>
        </dialog>
      </section>
    </main>
    <script src="bundle.js"></script>
  </body>
</html>
